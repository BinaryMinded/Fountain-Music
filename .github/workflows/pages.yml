name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - "claude/**"

# Only needs write access to push the gh-pages branch — no environment
# protection rules involved, so this works from any source branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          # Preserve the web/ + colorschemes/ relative path structure.
          # Root index.html redirects visitors straight to /web/.
          mkdir -p _site/web _site/colorschemes
          cp web/index.html _site/web/index.html
          cp colorschemes/*.png _site/colorschemes/
          printf '<meta http-equiv="refresh" content="0;url=web/">' > _site/index.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
