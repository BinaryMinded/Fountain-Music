name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - "claude/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          # Preserve the web/ + colorschemes/ structure so the
          # relative path ../colorschemes/ in index.html still works.
          # A redirect at the root sends visitors straight to /web/.
          mkdir -p _site/web _site/colorschemes
          cp web/index.html _site/web/index.html
          cp colorschemes/*.png _site/colorschemes/
          printf '<meta http-equiv="refresh" content="0;url=web/">' > _site/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
