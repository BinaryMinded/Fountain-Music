<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fountain Music Web Visualizer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 20% 20%, #1b1b37, #050509 60%);
        color: rgba(255, 255, 255, 0.85);
        overflow: hidden;
      }

      #glcanvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      .controls {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        border-radius: 14px;
        background: rgba(10, 12, 24, 0.72);
        box-shadow: 0 18px 48px rgba(5, 5, 10, 0.45);
        backdrop-filter: blur(12px);
        z-index: 2;
        max-width: min(320px, 80vw);
      }

      .controls h1 {
        margin: 0 0 4px;
        font-size: 18px;
        letter-spacing: 0.06em;
        font-weight: 600;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.9);
      }

      .controls p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.72);
      }

      .controls label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.65);
        margin-bottom: 4px;
      }

      .controls input[type="file"] {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.8);
      }

      .controls button {
        cursor: pointer;
        background: linear-gradient(135deg, #4368ff, #9c4dff);
        border: none;
        color: #fff;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transition: transform 120ms ease, box-shadow 120ms ease;
        box-shadow: 0 12px 30px rgba(76, 102, 255, 0.35);
      }

      .controls button:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 36px rgba(76, 102, 255, 0.45);
      }

      .controls button:active {
        transform: translateY(0);
        box-shadow: 0 12px 28px rgba(76, 102, 255, 0.32);
      }

      audio {
        width: 100%;
        outline: none;
      }

      .status {
        font-size: 12px;
        letter-spacing: 0.03em;
        color: rgba(255, 255, 255, 0.55);
      }

      @media (max-width: 640px) {
        .controls {
          left: 50%;
          transform: translateX(-50%);
          align-items: center;
        }

        .controls p {
          text-align: center;
        }

        audio {
          max-width: 260px;
        }
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <h1>Fountain (Web)</h1>
      <p>
        Load a track or connect your microphone to drive the particle fountain. Move
        your pointer or press any key to unlock audio.
      </p>
      <div>
        <label for="audio-file">Audio File</label>
        <input id="audio-file" type="file" accept="audio/*" />
      </div>
      <button id="mic-button" type="button">Use Microphone</button>
      <audio id="audio" controls preload="auto"></audio>
      <div class="status" id="status"></div>
    </div>
    <canvas id="glcanvas"></canvas>
    <script type="module" src="visualizer.js"></script>
  </body>
</html>
